steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/gcp-devops-35440/python-app/python-dockerimage:v1"
      - "pthon-appbuid"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/gcp-devops-35440/python-app/python-dockerimage:v1"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "build the application using cloud build and deployed on cloud run"
        gcloud run deploy py-app \
          --image="asia-south1-docker.pkg.dev/gcp-devops-35440/python-app/python-dockerimage:v1" \
          --region="asia-south1" \
          --platform=managed \
          --allow-unauthenticated

images:
  - "asia-south1-docker.pkg.dev/gcp-devops-35440/python-app/python-dockerimage:v1"

options:
  logging: CLOUD_LOGGING_ONLY